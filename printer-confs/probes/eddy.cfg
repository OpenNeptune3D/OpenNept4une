# BTT Eddy (USB) probe settings for {{ printer_model }}, included last from printer.cfg.
#
# NOT tested on Neptune 4 hardware by OpenNept4une: treat as a starting point.
# Uses Klipper's built-in [probe_eddy_current] (no plugin needed); see
# ~/klipper/docs/Eddy_Probe.md. The i2c bus and thermistor pin below are for
# the BTT Eddy USB board; Eddy Coil / Eddy Duo wire them differently.
#
# Seeded once by OpenNept4une (generate_conf.py --seed-probe-cfg) and never
# overwritten afterwards: edit freely, your changes survive printer.cfg updates.
# Sections here are merged into the ones in printer.cfg, so any option set
# here wins. printer.cfg no longer has a [probe] section when this file is used.
#
# First-time calibration (Z homes on this probe, so it must be calibrated
# before G28 works; see "Performing initial calibration when homing with
# probe" in Eddy_Probe.md):
#   1. Nozzle ~20 mm above the bed centre:
#      LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy, then SAVE_CONFIG
#   2. G28 X Y, move over the bed centre, SET_KINEMATIC_POSITION Z=25,
#      then Calibrate_Probe_Z_Offset (paper test), ACCEPT, SAVE_CONFIG

[mcu eddy]
serial: {{ probe_serial }}
restart_method: command

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: {{ probe_x_offset }}  # probe coil centre relative to the nozzle
y_offset: {{ probe_y_offset }}
descend_z: 0.5  # Klipper's recommended value

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[safe_z_home]
home_xy_position: {{ home_xy_position }}  # puts the probe over this model's stock Z homing spot

[bed_mesh]
zero_reference_position: {{ home_xy_position }}  # where Z=0 is set (same spot as homing)
mesh_min: {{ mesh_min }}  # probe coordinates
mesh_max: {{ mesh_max }}
probe_count: {{ probe_count }}  # ~10.8 mm spacing for this bed
# PRINT_START meshes with the default (descend) method. For a faster scan,
# once the bed is known to be parallel to the rails:
#   BED_MESH_CALIBRATE METHOD=scan HORIZONTAL_MOVE_Z=1

[axis_twist_compensation]
calibrate_start_x: {{ axis_twist_start_x }}  # nozzle X range where nozzle and probe are both over the bed
calibrate_end_x: {{ axis_twist_end_x }}
calibrate_y: {{ axis_twist_y }}

[screws_tilt_adjust]
{{ screw_tilt }}

[gcode_macro Calibrate_Probe_Z_Offset]
gcode:
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy

# Called by PRINT_START in place of G28, after the bed is at temperature.
# Once tap_threshold is calibrated (PROBE_EDDY_CURRENT_TAP_CALIBRATE), a
# nozzle-contact Z reference can be added here.
[gcode_macro _PRINT_START_HOME]
gcode:
    G28
