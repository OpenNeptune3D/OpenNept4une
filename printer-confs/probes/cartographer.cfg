# Cartographer probe settings for {{ printer_model }}, included last from printer.cfg.
#
# Seeded once by OpenNept4une (generate_conf.py --seed-probe-cfg) and never
# overwritten afterwards: edit freely, your changes survive printer.cfg updates.
# Sections here are merged into the ones in printer.cfg, so any option set
# here wins. printer.cfg no longer has a [probe] section when this file is used.
#
# Needs the Cartographer Klipper plugin (cartographer3d-plugin) installed.
# Check every value below against your mount before the first homing.

[mcu cartographer]
serial: {{ probe_serial }}
#canbus_uuid:            # use this instead of serial for a CAN-connected probe
restart_method: command  # not needed for CAN

[cartographer]
mcu: cartographer
x_offset: {{ probe_x_offset }}  # probe coil centre relative to the nozzle
y_offset: {{ probe_y_offset }}
verbose: yes

[stepper_z]
homing_retract_dist: 0  # required by the plugin with probe:z_virtual_endstop

[safe_z_home]
home_xy_position: {{ home_xy_position }}  # puts the probe over this model's stock Z homing spot

[bed_mesh]
zero_reference_position: {{ home_xy_position }}  # where Z=0 is set (same spot as homing)
speed: 150
horizontal_move_z: 3
mesh_min: {{ mesh_min }}  # probe coordinates
mesh_max: {{ mesh_max }}
probe_count: {{ probe_count }}  # ~10.8 mm spacing for this bed
adaptive_margin: 10
mesh_pps: 0, 0  # scanning mesh is dense enough, no interpolation

[axis_twist_compensation]
calibrate_start_x: {{ axis_twist_start_x }}  # nozzle X range where nozzle and probe are both over the bed
calibrate_end_x: {{ axis_twist_end_x }}
calibrate_y: {{ axis_twist_y }}

[screws_tilt_adjust]
{{ screw_tilt }}

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

{{ probe_accel_section }}

[gcode_macro Calibrate_Probe_Z_Offset]
gcode:
    G28 X Y
    CARTOGRAPHER_TOUCH_CALIBRATE

[gcode_macro Axis_Twist_Comp_Tune]
gcode:
    {% set current = printer.heater_bed.target|round(0) %}
    {% set target = current or 60 %}
    {% if current == 0 %}
    RESPOND PREFIX="info" MSG="No bed target, heating to {target} °C"
    SET_BED_TEMPERATURE TARGET={target}
    {% else %}
    RESPOND PREFIX="info" MSG="Waiting for bed to reach {target} °C"
    {% endif %}
    BED_TEMPERATURE_WAIT MINIMUM={target - 2} MAXIMUM={target + 5}
    CG28
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION

# Called by PRINT_START in place of G28, after the bed is at temperature.
[gcode_macro _PRINT_START_HOME]
gcode:
    CG28
    G90
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=140  ; soften filament on the nozzle tip
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=136 MAXIMUM=150
    CARTOGRAPHER_TOUCH_HOME  ; nozzle touch for the real Z0
