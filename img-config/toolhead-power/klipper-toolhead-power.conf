# Installed as /etc/systemd/system/klipper.service.d/opennept4une-toolhead-power.conf.
# Wants, not Requires: if the power service fails Klipper still starts and reports the
# missing THR MCU, instead of not starting at all.
[Unit]
Wants=opennept4une-toolhead-power.service
After=opennept4une-toolhead-power.service
